[package]
name = "apollo"
version = "1.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.21"
rustfft = "6.2"
crossbeam-channel = "0.5"
walkdir = "2.5"
dirs = "5.0"
unicode-width = "0.2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
toml = "1.1.6"
